schema_version: 1
stage: 8
target_logit: malignant
precision: float32
input_size: 384
normalization_region: valid_breast_without_letterbox_padding
binary_top_fraction: 0.10
formal_split: official_test
localization_label: 1
batch_size: 2
geometry_audit_output_dir: artifacts/experiments/phase8/gradcam_pp_geometry_audit_attempt2
formal_output_dir: artifacts/experiments/phase8/gradcam_pp_official_test
bootstrap:
  unit: patient_id
  valid_replicates: 2000
  seed: 42
  confidence_level: 0.95
visualization:
  colormap: magma
  overlay_alpha: 0.45
models:
  P5-E02_seed42:
    target_layer: channel_projection
    expected_shape: [512, 12, 12]
  P7-E01_V2S_seed42:
    target_layer: channel_projection
    expected_shape: [512, 12, 12]
  P7-E04_V2S_BiFPN_CBAM_seed42:
    target_layer: token_compressor.mixer
    expected_shape: [512, 12, 12]
qualitative_panel:
  strata: [label, view]
  samples_per_stratum: 3
  ordering: sha256_sample_id_ascending
localization_metrics:
  - iou
  - dice
  - lesion_hit_rate
  - energy_inside_roi
